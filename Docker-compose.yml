services:
  # ==========================================
  # BANCO DE DADOS (Exigência da API v2)
  # ==========================================
  postgres-db:
    image: postgres:15-alpine
    container_name: postgres-db
    environment:
      - POSTGRES_USER=evolution
      - POSTGRES_PASSWORD=senha_db_123
      - POSTGRES_DB=evolution
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # ==========================================
  # API DO WHATSAPP (Evolution API)
  # ==========================================
  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution-api
    ports:
      - "8081:8080"
    environment:
      - SERVER_PORT=8080
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=${WHATSAPP_API_KEY}
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:senha_db_123@postgres-db:5432/evolution?schema=public
      - DATABASE_CONNECTION_CLIENT_NAME=bot_repasse
      - CACHE_REDIS_ENABLED=false
    depends_on:
      - postgres-db
    volumes:
      - evolution_instances:/evolution/instances
    restart: unless-stopped

  # ==========================================
  # NOSSO BOT JAVA
  # ==========================================
  bot-repasse:
    build: .
    container_name: bot-repasse
    depends_on:
      - evolution-api
    env_file:
      - .env
    environment:
      - WHATSAPP_API_URL=http://evolution-api:8080
    restart: unless-stopped

volumes:
  evolution_instances:
  postgres_data: