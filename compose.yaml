name: bot-repasse

x-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: bot-repasse-postgres
    restart: unless-stopped
    init: true
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - bot-network
    logging: *default-logging

  evolution-api:
    image: ${EVOLUTION_IMAGE:-evolution-api-newsletter:2.4.0-rc2-working}
    pull_policy: never
    container_name: bot-repasse-evolution
    restart: unless-stopped
    init: true
    ports:
      - "${EVOLUTION_BIND_ADDRESS:-127.0.0.1}:${EVOLUTION_HOST_PORT:-8081}:8080"
    environment:
      SERVER_PORT: "8080"
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: ${WHATSAPP_API_KEY}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/${POSTGRES_DB}?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: bot_repasse
      CACHE_REDIS_ENABLED: "false"
      TZ: ${TZ:-America/Sao_Paulo}
    depends_on:
      postgres-db:
        condition: service_healthy
    volumes:
      - evolution_instances:/evolution/instances
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:8080/manager')
          .then(r=>process.exit((r.ok||r.status===301||r.status===302)?0:1))
          .catch(()=>process.exit(1))"
      interval: 15s
      timeout: 8s
      retries: 20
      start_period: 45s
    networks:
      - bot-network
    stop_grace_period: 30s
    logging: *default-logging

  bot-repasse:
    image: ${BOT_IMAGE:-bot-repasse:1.0.0}
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bot-repasse
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      WHATSAPP_API_URL: http://evolution-api:8080
      TZ: ${TZ:-America/Sao_Paulo}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=70.0 -XX:+ExitOnOutOfMemoryError -Dfile.encoding=UTF-8}
    depends_on:
      evolution-api:
        condition: service_healthy
    tmpfs:
      - /tmp:size=128m,mode=1777
    networks:
      - bot-network
    stop_grace_period: 30s
    logging: *default-logging

networks:
  bot-network:
    name: bot-repasse-network
    driver: bridge

volumes:
  postgres_data:
    name: bot-repasse-postgres-data
  evolution_instances:
    name: bot-repasse-evolution-instances
